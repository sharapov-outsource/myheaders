<!DOCTYPE html>
<html lang="%LANG%" dir="%DIR%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <!-- Title and description come from the same dictionary the page uses, in the
       language the request asked for, so a crawler that runs no JavaScript sees
       what a visitor sees. -->
  <title>%TITLE%</title>
  <meta name="description" content="%DESCRIPTION%" id="meta-description">
  <!-- Only the home page is worth indexing; a report page is a check result. -->
  <meta name="robots" content="%ROBOTS%" id="meta-robots">
  <link rel="canonical" href="%URL%" id="link-canonical">

  <meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f9f4ea" media="(prefers-color-scheme: light)">
  <meta name="application-name" content="Headers Check">
  <meta name="apple-mobile-web-app-title" content="Headers Check">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Headers Check">
  <meta property="og:url" content="%URL%" id="og-url">
  <meta property="og:locale" content="%LOCALE%" id="og-locale">
  <meta property="og:title" content="%TITLE%" id="og-title">
  <meta property="og:description" content="%DESCRIPTION%" id="og-description">
  <meta property="og:image" content="%ORIGIN%/static/og-image.png" id="og-image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Headers Check">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%TITLE%" id="twitter-title">
  <meta name="twitter:description" content="%DESCRIPTION%" id="twitter-description">
  <meta name="twitter:image" content="%ORIGIN%/static/og-image.png" id="twitter-image">

  <link rel="stylesheet" href="/static/kit/base.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Headers Check",
    "url": "%ORIGIN%/",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Any",
    "description": "%DESCRIPTION%",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "inLanguage": ["en", "ru", "es", "zh", "hi", "ar", "pt", "fr", "de", "ja", "tr", "uk"]
  }
  </script>
%ANALYTICS%
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <rect class="tile" width="1024" height="1024" rx="336"/>
          <!-- A response: a stack of header lines, the first one the accent. -->
          <rect class="accent" x="248" y="300" width="400" height="72" rx="36"/>
          <rect class="glyph" x="248" y="440" width="528" height="72" rx="36"/>
          <rect class="glyph" x="248" y="580" width="440" height="72" rx="36"/>
          <rect class="glyph" x="248" y="720" width="312" height="72" rx="36"/>
        </svg>
      </span>
      <div>
        <div class="wordmark">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1 data-i18n="h1">Headers Check</h1>
        </div>
        <div class="sub" data-i18n="subtitle"></div>
      </div>
    </div>
    <div class="tools">
      <select id="lang" aria-label="Language"></select>
      <button id="btn-rescan"><span class="mark" aria-hidden="true">↻</span><span data-i18n="btn_rescan"></span></button>
      <button id="btn-copy-json"><span class="mark" aria-hidden="true">⧉</span><span data-i18n="btn_copy_json"></span></button>
      <button id="btn-save-json"><span class="mark" aria-hidden="true">↓</span><span data-i18n="btn_save_json"></span></button>
      <a class="ghlink" href="https://github.com/sharapov-outsource/myheaders"
         target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <form class="search" id="search-form">
    <input id="search-host" type="text" inputmode="url" spellcheck="false" autocomplete="off"
           placeholder="example.com" aria-label="Domain">
    <button type="submit" class="primary" id="btn-scan"><span data-i18n="btn_scan"></span></button>
  </form>

  <section class="hero" id="hero">
    <div class="hero-grade">
      <div class="grade-badge pending" id="grade-badge">·</div>
      <div class="grade-caption" data-i18n="hero_grade"></div>
    </div>
    <div class="hero-main">
      <div class="hero-label" data-i18n="hero_label"></div>
      <div class="host-line">
        <span class="host" id="hero-host">…</span>
      </div>
      <div class="hero-meta" id="hero-meta"></div>
      <div class="progress" id="progress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </div>
  </section>

  <div id="alerts"></div>

  <main class="grid" id="report" hidden>

    <section class="card">
      <h2><span data-i18n="card_grade"></span></h2>
      <div class="meter"><span class="k" data-i18n="comp_transport"></span><span class="bar"><i id="bar-transport"></i></span><span class="v" id="score-transport"></span></div>
      <div class="meter"><span class="k" data-i18n="comp_csp"></span><span class="bar"><i id="bar-csp"></i></span><span class="v" id="score-csp"></span></div>
      <div class="meter"><span class="k" data-i18n="comp_headers"></span><span class="bar"><i id="bar-headers"></i></span><span class="v" id="score-headers"></span></div>
      <div class="row"><span class="k" data-i18n="k_total_score"></span><span class="v skeleton" id="score-total"></span></div>
      <div class="row"><span class="k" data-i18n="k_canonical"></span><span class="v skeleton" id="meta-url"></span></div>
      <div class="row"><span class="k" data-i18n="k_requests"></span><span class="v skeleton" id="meta-requests"></span></div>
      <div class="row"><span class="k" data-i18n="k_elapsed"></span><span class="v skeleton" id="meta-elapsed"></span></div>
      <div class="tags" id="grade-caps"></div>
      <div class="tags" id="grade-warnings"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_csp"></span></h2>
      <div class="row"><span class="k" data-i18n="k_csp_present"></span><span class="v skeleton big" id="csp-present"></span></div>
      <div class="row"><span class="k" data-i18n="k_csp_enforced"></span><span class="v skeleton" id="csp-enforced"></span></div>
      <div class="row"><span class="k" data-i18n="k_csp_directives"></span><span class="v skeleton" id="csp-count"></span></div>
      <div class="row"><span class="k" data-i18n="k_csp_nonce"></span><span class="v skeleton" id="csp-nonce"></span></div>
      <div class="row"><span class="k" data-i18n="k_csp_strict_dynamic"></span><span class="v skeleton" id="csp-strict-dynamic"></span></div>
      <div class="sub-head" data-i18n="k_csp_script_src"></div>
      <pre class="raw" id="csp-raw">…</pre>
      <div class="note" data-i18n="note_csp"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_hsts"></span></h2>
      <div class="row"><span class="k" data-i18n="k_hsts_present"></span><span class="v skeleton big" id="hsts-present"></span></div>
      <div class="row"><span class="k" data-i18n="k_hsts_maxage"></span><span class="v skeleton" id="hsts-maxage"></span></div>
      <div class="row"><span class="k" data-i18n="k_hsts_subdomains"></span><span class="v skeleton" id="hsts-sub"></span></div>
      <div class="row"><span class="k" data-i18n="k_hsts_preload_directive"></span><span class="v skeleton" id="hsts-directive"></span></div>
      <div class="row"><span class="k" data-i18n="k_hsts_preloaded"></span><span class="v skeleton" id="hsts-listed"></span></div>
      <div class="row"><span class="k" data-i18n="k_hsts_eligible"></span><span class="v skeleton" id="hsts-eligible"></span></div>
      <div class="note" data-i18n="note_hsts"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_protocols"></span></h2>
      <div class="row"><span class="k" data-i18n="k_alpn"></span><span class="v skeleton big" id="p-alpn"></span></div>
      <div class="row"><span class="k" data-i18n="k_http2"></span><span class="v skeleton" id="p-http2"></span></div>
      <div class="row"><span class="k" data-i18n="k_http3"></span><span class="v skeleton" id="p-http3"></span></div>
      <div class="row"><span class="k" data-i18n="k_tls_protocol"></span><span class="v skeleton" id="p-tls"></span></div>
      <div class="row"><span class="k" data-i18n="k_compression"></span><span class="v skeleton" id="p-compression"></span></div>
      <div class="note" data-i18n="note_protocols"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_cookies"></span></h2>
      <div class="row"><span class="k" data-i18n="k_cookie_count"></span><span class="v skeleton big" id="c-count"></span></div>
      <div class="row"><span class="k" data-i18n="k_cookies_secure"></span><span class="v skeleton" id="c-secure"></span></div>
      <div class="row"><span class="k" data-i18n="k_cookies_httponly"></span><span class="v skeleton" id="c-httponly"></span></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_cookie"></th>
            <th data-i18n="th_secure"></th>
            <th data-i18n="th_httponly"></th>
            <th data-i18n="th_samesite"></th>
          </tr></thead>
          <tbody id="cookie-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_cookies"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_headers"></span></h2>
      <div class="row"><span class="k" data-i18n="k_headers_present"></span><span class="v skeleton big" id="h-present"></span></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_header"></th>
            <th data-i18n="th_value"></th>
          </tr></thead>
          <tbody id="header-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_chain"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_entry"></th>
            <th data-i18n="th_status"></th>
            <th data-i18n="th_url"></th>
            <th data-i18n="th_time"></th>
          </tr></thead>
          <tbody id="chain-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_chain"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_csp_directives"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_directive"></th>
            <th data-i18n="th_sources"></th>
          </tr></thead>
          <tbody id="csp-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_other"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_header"></th>
            <th data-i18n="th_value"></th>
          </tr></thead>
          <tbody id="other-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_flags"></span></h2>
      <div id="flag-list" class="findings"></div>
      <div class="note" data-i18n="note_flags"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_raw"></span></h2>
      <pre class="raw" id="raw-json">…</pre>
    </section>

  </main>


  <section class="empty" id="empty">
    <p data-i18n="empty_hint"></p>
    <div class="examples-label" data-i18n="empty_examples"></div>
    <div class="examples" id="examples"></div>
  </section>

  <footer>
    %SERVICES%
    <p id="api-hint"></p>
    <p><span data-i18n="footer1"></span><br><span data-i18n="footer2"></span><br><span data-i18n="footer3"></span></p>
    <a class="footer-credit" href="https://sharapov.biz"
       target="_blank" rel="noopener noreferrer" aria-label="Sharapov">
      <img src="/static/kit/sharapov.svg" alt="Sharapov" width="72" height="16">
    </a>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/kit/i18n-common.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
